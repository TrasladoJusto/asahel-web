<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-traslado" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-traslado)"/>
  
  <!-- Map area -->
  <rect x="100" y="150" width="480" height="220" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- Airport marker -->
  <circle cx="340" cy="260" r="20" fill="rgba(255,205,0,0.4)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  
  <!-- Driver markers -->
  <circle cx="150" cy="190" r="15" fill="rgba(0,245,255,0.4)"/>
  <circle cx="250" cy="210" r="15" fill="rgba(255,0,110,0.4)"/>
  <circle cx="450" cy="190" r="15" fill="rgba(0,255,136,0.4)"/>
  
  <!-- Vehicle -->
  <rect x="400" y="250" width="80" height="40" rx="6" fill="rgba(255,184,0,0.3)"/>
  
  <!-- WhatsApp integration -->
  <div style="display: flex; justify-content: center; margin-top: 300;">
    <rect x="300" y="340" width="200" height="50" rx="25" fill="rgba(37,211,102,0.2)" stroke="rgba(37,211,102,0.4)"/>
    <text x="400" y="365" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#25d36b" text-anchor="middle">WHATSAPP</text>
  </div>
  
  <!-- Title -->
  <text x="400" y="60" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">TRASLADO JUSTO</text>
  <text x="400" y="85" font-family="JetBrains Mono, monospace" font-size="12" fill="#00f5ff" text-anchor="middle">Transporte • Mapa • WhatsApp</text>
</svg>