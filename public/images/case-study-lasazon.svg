<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-taslado" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-taslado)"/>
  
  <!-- Restaurant table -->
  <rect x="100" y="200" width="300" height="150" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- Food plates -->
  <circle cx="150" cy="250" r="25" fill="rgba(255,205,0,0.3)" stroke="rgba(255,255,255,0.2)"/>
  <circle cx="250" cy="270" r="20" fill="rgba(255,70,70,0.3)" stroke="rgba(255,255,255,0.2)"/>
  
  <!-- Reservation button -->
  <rect x="450" y="200" width="250" height="80" rx="12" fill="rgba(0,245,255,0.15)" stroke="rgba(0,245,255,0.3)"/>
  <text x="575" y="245" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#00f5ff" text-anchor="middle">RESERVAR</text>
  
  <!-- Gallery -->
  <rect x="100" y="380" width="180" height="50" rx="8" fill="rgba(0,0,0,0.3)"/>
  <rect x="300" y="380" width="180" height="50" rx="8" fill="rgba(0,0,0,0.3)"/>
  <rect x="500" y="380" width="180" height="50" rx="8" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Title -->
  <text x="400" y="55" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">LA SAZÓN</text>
  <text x="400" y="80" font-family="JetBrains Mono, monospace" font-size="12" fill="#ffb800" text-anchor="middle">Fine Dining • Reservas • Menú Interactivo</text>
</svg>