<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-techpro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-techpro)"/>
  
  <!-- Medical equipment -->
  <rect x="80" y="200" width="100" height="120" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- Monitor -->
  <rect x="200" y="220" width="120" height="80" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="260" y="270" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">PATIENT</text>
  <text x="260" y="295" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#f0f4ff">John D.</text>
  
  <!-- WhatsApp icon -->
  <circle cx="500" cy="260" r="35" fill="rgba(37,211,102,0.2)" stroke="rgba(37,211,102,0.4)" stroke-width="2"/>
  <path d="M488 253l30 18 5 5 30-18-30-18z fill="#25d36b"/>
  
  <!-- Contact form -->
  <rect x="600" y="200" width="160" height="100" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
  <text x="680" y="260" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#f0f4ff" text-anchor="middle">CONTACTO</text>
  
  <!-- Equipment list -->
  <rect x="100" y="380" width="140" height="40" rx="8" fill="rgba(0,245,255,0.1)" stroke="rgba(0,245,255,0.3)"/>
  
  <!-- Title -->
  <text x="400" y="55" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">TECHPRO</text>
  <text x="400" y="75" font-family="JetBrains Mono, monospace" font-size="12" fill="#00f5ff" text-anchor="middle">Servicio Técnico Médico • Equipos • WhatsApp</text>
</svg>