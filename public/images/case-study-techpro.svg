<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="90" x2="800" y2="90" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="450" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="450" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="450" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="450" stroke="#3b82f6" stroke-width="0.5"/>
  </g>
  
  <!-- Dashboard mockup -->
  <g transform="translate(50, 30)">
    <!-- Main card -->
    <rect x="0" y="0" width="700" height="390" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    
    <!-- Header bar -->
    <rect x="0" y="0" width="700" height="60" rx="12" fill="#1e293b"/>
    <circle cx="30" cy="30" r="8" fill="#3b82f6"/>
    <circle cx="55" cy="30" r="8" fill="#22c55e"/>
    <circle cx="80" cy="30" r="8" fill="#eab308"/>
    <text x="350" y="35" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">TechPro Dashboard</text>
    
    <!-- Sidebar -->
    <rect x="0" y="60" width="180" height="330" fill="#1e293b"/>
    <rect x="20" y="80" width="140" height="40" rx="6" fill="#3b82f6"/>
    <text x="90" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Dashboard</text>
    <rect x="20" y="140" width="140" height="35" rx="6" fill="transparent"/>
    <text x="90" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Equipos</text>
    <rect x="20" y="185" width="140" height="35" rx="6" fill="transparent"/>
    <text x="90" y="207" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Servicios</text>
    <rect x="20" y="230" width="140" height="35" rx="6" fill="transparent"/>
    <text x="90" y="252" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Contacto</text>
    
    <!-- Main content -->
    <rect x="200" y="80" width="480" height="100" rx="8" fill="#0f172a"/>
    <text x="220" y="110" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Equipos Activos</text>
    <text x="220" y="145" fill="#3b82f6" font-family="Arial, sans-serif" font-size="28" font-weight="bold">127</text>
    <text x="350" y="145" fill="#22c55e" font-family="Arial, sans-serif" font-size="12">+12% este mes</text>
    
    <!-- Chart placeholder -->
    <rect x="200" y="200" width="230" height="170" rx="8" fill="#0f172a"/>
    <text x="220" y="225" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11">Rendimiento</text>
    <polyline points="220,320 280,280 340,300 400,250 420,260" fill="none" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Recent activity -->
    <rect x="450" y="200" width="230" height="170" rx="8" fill="#0f172a"/>
    <text x="470" y="225" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11">Actividad Reciente</text>
    <rect x="470" y="245" width="190" height="25" rx="4" fill="#1e293b"/>
    <text x="480" y="262" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Servicio completado</text>
    <rect x="470" y="280" width="190" height="25" rx="4" fill="#1e293b"/>
    <text x="480" y="297" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Nuevo equipo registrado</text>
    <rect x="470" y="315" width="190" height="25" rx="4" fill="#1e293b"/>
    <text x="480" y="332" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Mantenimiento programado</text>
  </g>
  
  <!-- Brand -->
  <text x="50" y="430" fill="#3b82f6" font-family="Arial, sans-serif" font-size="18" font-weight="bold">TechPro</text>
  <text x="130" y="430" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Servicio Técnico Médico</text>
</svg>